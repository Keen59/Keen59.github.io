<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe6" />
    <title>Marangoz Atölyesi</title>
    <meta name="description" content="Masif ahşap parçalar. Ödeme Shopier üzerinden alınır." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1.5" y="1.5" width="29" height="29" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
          <path d="M7 23 L16 8 L25 23" fill="none" stroke="currentColor" stroke-width="1.4"></path>
          <path d="M11 23 H21" stroke="currentColor" stroke-width="1.4"></path>
        </svg>
        <span id="brand-name">Marangoz Atölyesi</span>
      </a>
      <nav>
        <a id="phone-link" class="phone" hidden href="#"></a>
        <a href="#/urunler">Ürünler</a>
        <a id="cart-link" class="cart-link" href="#/sepet">Sepet</a>
      </nav>
    </header>
    <main id="app" class="wrap"></main>
    <footer class="foot">
      <div>
        <p id="foot-name" class="foot-title">Marangoz Atölyesi</p>
        <p id="foot-tag" class="muted"></p>
      </div>
      <div>
        <p class="eyebrow">Ödeme</p>
        <p class="muted">Kart tahsilatı Shopier sayfasında olur. Bu sayfa sunucu kurmadan çalışır.</p>
        <a href="#/yonetim">Yönetim</a>
      </div>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
